name: Release

on:
  push:
    tags:
      - 'v*'
      - 'server-v*'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Editions to publish (all = Desktop + Server, shared tools once)'
        type: choice
        options:
          - all
          - desktop
          - server
        default: all
      version:
        description: 'Release version (e.g. 1.2.15)'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify shared services and distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release and edition contracts
        run: |
          go test ./internal/remote ./internal/cloudflared ./internal/serverboot ./internal/updater ./internal/orchestrator
          go test ./internal/store -run '^TestVerifyPasswordDoesNotOpenOrChangeDatabase$'
          go test -tags server ./internal/updater
          python3 scripts/edition_test.py
          python3 scripts/release_assets_test.py
          bash scripts/install_test.sh
      - name: Verify browser and mobile transport
        working-directory: cmd/praimate-gui/frontend
        run: |
          npm ci
          npm run test:remote
          npm run test:mobile
          npm run test:settings-ui

  build:
    needs: verify
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: windows-amd64
            os: windows-latest
          - target: windows-arm64
            os: windows-latest
          - target: darwin-arm64
            os: macos-15
          - target: darwin-amd64
            os: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          check-latest: true
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            pkg-config \
            zip

      - name: Determine Version
        id: get_version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_EDITION: ${{ inputs.edition }}
        run: |
          bash scripts/release-metadata.sh >> "$GITHUB_OUTPUT"

      - name: Build Target (${{ matrix.target }})
        shell: bash
        env:
          EDITIONS: ${{ steps.get_version.outputs.EDITION }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$EDITIONS" = all ]; then
            bash scripts/build.sh --edition=desktop --with-code --with-graphify "$TARGET"
            PRAIMATE_FRONTEND_READY=1 bash scripts/build.sh --edition=server --reuse-shared=dist "$TARGET"
          else
            bash scripts/build.sh --edition="$EDITIONS" --with-code --with-graphify "$TARGET"
          fi
          python3 scripts/stage-release-assets.py --edition "$EDITIONS" --target "$TARGET"

      - name: Verify native startup contracts
        shell: bash
        run: go test ./internal/serverboot

      - name: Verify Server lifecycle on Linux
        if: runner.os == 'Linux'
        working-directory: cmd/praimate-gui
        run: go test -tags desktop,production,webkit2_41,server -run 'TestManaged|TestHeadlessManaged|TestServerListener|TestServerStartup|TestRemoteClientsCannotRegister' .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            dist/release/*
          if-no-files-found: error

  android:
    name: Build signed Android preview
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare private persistent preview signer
        env:
          ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ.get('ANDROID_PREVIEW_KEYSTORE_BASE64', '')
          if not raw:
              raise SystemExit('Configure ANDROID_PREVIEW_KEYSTORE_BASE64 before publishing an installable Android update')
          target = Path(os.environ['RUNNER_TEMP']) / 'praimate-preview.keystore'
          target.write_bytes(base64.b64decode(raw, validate=True))
          target.chmod(0o600)
          PY
      - name: Build and verify Android
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_EDITION: ${{ inputs.edition }}
          PRAIMATE_ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/praimate-preview.keystore
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          (cd cmd/praimate-gui/frontend && npm ci)
          VERSION="$(bash scripts/release-metadata.sh | sed -n 's/^VERSION=//p')" bash scripts/build-android.sh
          cp dist/android/praimate-mobile-debug.apk dist/android/praimate-mobile-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/android/praimate-mobile-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-android
          path: dist/android/praimate-mobile-preview.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          pattern: artifacts-*
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_EDITION: ${{ inputs.edition }}
        run: |
          bash scripts/release-metadata.sh >> "$GITHUB_OUTPUT"

      - name: Generate Checksums
        working-directory: release-dist
        run: |
          python3 ../scripts/release-checksums.py

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.TAG }}"
          PRERELEASE_FLAG="--prerelease=false"
          LATEST_FLAG="--latest=true"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            LATEST_FLAG="--latest=false"
          fi
          if [ "${{ steps.release_info.outputs.EDITION }}" = server ]; then
            PRERELEASE_FLAG="--prerelease"
            LATEST_FLAG="--latest=false"
          fi

          # New releases stay private until every artifact was uploaded.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft \
              --target "$GITHUB_SHA" \
              --title "PrAImate $TAG" \
              --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$TAG" release-dist/* --clobber
          if [ "${{ inputs.draft }}" != true ]; then
            gh release edit "$TAG" --draft=false $PRERELEASE_FLAG $LATEST_FLAG
          fi
