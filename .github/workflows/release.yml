name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.10)'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: windows-amd64
            os: windows-latest
          - target: windows-arm64
            os: windows-latest
          - target: darwin-arm64
            os: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            pkg-config \
            zip

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            # Extract from version.go
            V=$(grep 'Current = ' internal/version/version.go | cut -d'"' -f2 || echo "1.2.10")
            echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Target (${{ matrix.target }})
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}" bash scripts/build.sh "${{ matrix.target }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/praimate-cli-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          pattern: artifacts-*
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            V=$(grep 'Current = ' internal/version/version.go | cut -d'"' -f2 || echo "1.2.10")
            TAG="v$V"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate Checksums
        working-directory: release-dist
        run: |
          sha256sum * > SHA256SUMS || shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.TAG }}"
          DRAFT_FLAG=""
          if [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # If release already exists for this tag, upload/update assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" release-dist/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release-dist/* \
              --title "PrAImate $TAG" \
              --generate-notes \
              $DRAFT_FLAG $PRERELEASE_FLAG
          fi
